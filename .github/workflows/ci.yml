name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}

      - name: Install Composer (action)
        uses: php-actions/composer@v6

      - name: Mark repo as safe for git (fix dubious ownership in runners)
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan (if present, non-blocking)
        run: |
          if [ -x ./vendor/bin/phpstan ]; then
            ./vendor/bin/phpstan analyse --no-progress || true
          else
            echo 'phpstan not installed; skipping'
          fi

      - name: Run Psalm (if present, non-blocking)
        run: |
          if [ -x ./vendor/bin/psalm ]; then
            ./vendor/bin/psalm --no-progress || true
          else
            echo 'psalm not installed; skipping'
          fi

      - name: PHP syntax check
        run: find framework -name "*.php" -exec php -l {} \;

      - name: Run native tests
        run: php tests/TestRunner.php

      - name: Run PHPUnit (if present)
        run: |
          if [ -x ./vendor/bin/phpunit ]; then
            ./vendor/bin/phpunit --colors=always
          else
            echo 'No phpunit found; skipping'
          fi
