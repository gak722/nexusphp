name: SAST and Dependency Scanning

on:
  pull_request:
    branches: [ main ]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.1'

      - name: Install dependencies (including dev deps for SCA tools)
        run: composer install --no-interaction --prefer-dist

      - name: Run Psalm if present
        run: |
          if [ -x ./vendor/bin/psalm ]; then
            ./vendor/bin/psalm --no-progress || true
          fi

      - name: Composer audit
        run: composer audit --format=json || true

      - name: Upload SCA annotations
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: codeql-results.sarif || true
